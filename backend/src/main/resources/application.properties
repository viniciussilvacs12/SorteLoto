spring.application.name=sorteloto

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartloto}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartloto}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT — configure SMARTLOTO_JWT_SECRET fora do código em ambientes reais.
smartloto.jwt.secret=${SMARTLOTO_JWT_SECRET:change-me-development-secret-minimum-32-chars}
smartloto.jwt.expiration-minutes=${SMARTLOTO_JWT_EXPIRATION_MINUTES:120}

# Admin bootstrap — desativado por padrão; habilite explicitamente via .env.
smartloto.admin.enabled=${SMARTLOTO_ADMIN_ENABLED:false}
smartloto.admin.email=${SMARTLOTO_ADMIN_EMAIL:admin@smartloto.local}
smartloto.admin.password=${SMARTLOTO_ADMIN_PASSWORD:}
smartloto.admin.sync-on-start=${SMARTLOTO_ADMIN_SYNC_ON_START:false}

# Google Identity Services — opcional.
sorteloto.google.client-id=${GOOGLE_CLIENT_ID:}
